bots:
  - import: (data)/bots/_deny-pathological.yaml
  - import: (data)/bots/aggressive-brazilian-scrapers.yaml
  - import: (data)/meta/ai-block-aggressive.yaml
  - import: (data)/crawlers/_allow-good.yaml
  - import: (data)/clients/x-firefox-ai.yaml
  - import: (data)/crawlers/xai.yaml
  - import: (data)/common/keep-internet-working.yaml

  - name: countries-with-aggressive-scrapers
    action: WEIGH
    geoip:
      countries:
        - BR
        - CN
    weight:
      adjust: 10

  - name: aggressive-asns-without-functional-abuse-contact
    action: WEIGH
    asns:
      match:
        - 13335
        - 136907
        - 45102
    weight:
      adjust: 10

  - name: high-load-average
    action: WEIGH
    expression: load_1m >= 10.0
    weight:
      adjust: 20

  - name: low-load-average
    action: WEIGH
    expression: load_15m <= 4.0
    weight:
      adjust: -10

  - name: generic-browser
    user_agent_regex: >-
      Mozilla|Opera
    action: WEIGH
    weight:
      adjust: 10

dnsbl: false

honeypot:
  enabled: true
  implementation: naive

openGraph:
  enabled: true
  considerHost: true
  ttl: 24h

status_codes:
  CHALLENGE: 200
  DENY: 200

metrics:
  bind: ":9090"
  network: "tcp"

store:
  backend: memory
  parameters: {}

thresholds:
  - name: minimal-suspicion
    expression: weight <= 0
    action: ALLOW

  - name: mild-suspicion
    expression:
      all:
        - weight > 0
        - weight < 10
    action: CHALLENGE
    challenge:
      algorithm: metarefresh
      difficulty: 1

  - name: moderate-suspicion
    expression:
      all:
        - weight >= 10
        - weight < 20
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 2

  - name: mild-proof-of-work
    expression:
      all:
        - weight >= 20
        - weight < 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4

  - name: extreme-suspicion
    expression: weight >= 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 6

logging:
  sink: file
  parameters:
    file: /data/anubis.log
    maxBackups: 3
    maxBytes: 104857600
    maxAge: 7
    compress: true
