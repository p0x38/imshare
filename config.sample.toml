[server]
host = "0.0.0.0"
port = 5454

[storage]
uploadDirectory = "uploads"
maxFileSize = 26214400

[site]
name = "imshare"
version = "1.0.0"
description = "Self-hosted image archive and sharing server"

[auth]
baseUrl = "https://example.com"
trustedOrigins = ["https://example.com"]
emailAndPasswordEnabled = true

[auth.registration]
enabled = true
public = false

[features]
imagePosts = true
textPosts = true
comments = true
reactions = true
reports = true
recommendations = true
notifications = true
search = true
publicProfiles = true
publicPosts = true
apiDocs = true
sitemap = true
robots = true

[limits]
textPostCharacters = 500

[analytics]
googleAnalyticsMeasurementId = ""
googleTagManagerContainerId = ""
