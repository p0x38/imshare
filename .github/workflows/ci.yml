name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: file:./ci.db
            BETTER_AUTH_SECRET: ci-only-test-secret-change-me
            IMSHARE_CONFIG: config.sample.imshare
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm db:validate
            - run: pnpm prisma migrate deploy
            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm test
            - run: pnpm test:integration
            - run: pnpm build:client && playwright test
            - run: pnpm build
