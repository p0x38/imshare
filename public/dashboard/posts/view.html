<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Manage Post · imshare</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a class="brand" href="/">imshare</a><a href="/posts/">Posts</a
        ><a href="/dashboard/">Dashboard</a><a href="/account/">Account</a>
      </nav>
    </header>
    <main>
      <p><a href="/dashboard/posts/">&larr; My posts</a></p>
      <div id="content" class="box">Loading…</div>
    </main>
    <script type="module">
      const id = location.pathname.split("/").filter(Boolean).at(-1);
      const root = document.querySelector("#content");
      try {
        const r = await fetch("/v1/posts/" + encodeURIComponent(id));
        if (!r.ok) throw new Error();
        const { data: p } = await r.json();
        root.innerHTML =
          '<h1></h1><p><a class="button" href="/dashboard/posts/' +
          encodeURIComponent(p.id) +
          '/edit/">Edit</a> <button id="delete">Delete</button></p><p><a href="/posts/' +
          encodeURIComponent(p.id) +
          '">View public post</a></p>';
        root.querySelector("h1").textContent = p.title;
        document.querySelector("#delete").onclick = async () => {
          if (!confirm("Delete this post?")) return;
          const d = await fetch("/v1/posts/" + encodeURIComponent(p.id), {
            method: "DELETE",
          });
          if (d.ok) location.href = "/dashboard/posts/";
          else alert("Unable to delete post.");
        };
      } catch {
        root.innerHTML = "<h1>Post not found</h1>";
      }
    </script>
  </body>
</html>
