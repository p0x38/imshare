<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Post · imshare</title><link rel="stylesheet" href="/style.css"></head><body><header><nav><a class="brand" href="/">imshare</a><a href="/posts/">Posts</a><a href="/dashboard/">Dashboard</a><a href="/account/">Account</a></nav></header><main><h1>Edit Post</h1><form id="form" class="box"><label for="title">Title</label><input id="title" required><label for="description">Description</label><textarea id="description"></textarea><label for="sourceUrl">Source URL</label><input id="sourceUrl" type="url"><label for="tags">Tags</label><input id="tags"><label for="category">Category</label><select id="category"><option value="">None</option></select><button>Save changes</button><p id="error" class="error" hidden></p></form></main><script>const id=location.pathname.split('/').filter(Boolean).at(-2),form=document.querySelector('#form'),error=document.querySelector('#error');const fields={title:document.querySelector('#title'),description:document.querySelector('#description'),sourceUrl:document.querySelector('#sourceUrl'),tags:document.querySelector('#tags'),category:document.querySelector('#category')};try{const [postRes,catsRes]=await Promise.all([fetch('/v1/posts/'+encodeURIComponent(id)),fetch('/v1/categories?limit=100')]);if(postRes.status===401)location.href='/account/login/';if(!postRes.ok)throw new Error();const {data:p}=await postRes.json();for(const c of (await catsRes.json()).data||[]){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;fields.category.append(o);}fields.title.value=p.title||'';fields.description.value=p.description||'';fields.sourceUrl.value=p.sourceUrl||'';fields.tags.value=(p.tags||[]).map(t=>t.name).join(', ');fields.category.value=p.category?.id||'';}catch{error.textContent='Unable to load this post.';error.hidden=false;form.querySelector('button').disabled=true;}form.addEventListener('submit',async e=>{e.preventDefault();error.hidden=true;const r=await fetch('/v1/posts/'+encodeURIComponent(id),{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({title:fields.title.value,description:fields.description.value||null,sourceUrl:fields.sourceUrl.value||null,tags:fields.tags.value.split(',').map(x=>x.trim()).filter(Boolean),categoryId:fields.category.value||null})});if(r.ok)location.href='/dashboard/posts/'+encodeURIComponent(id)+'/';else{error.textContent='Unable to save changes.';error.hidden=false;}});</script></body></html>
