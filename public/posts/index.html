<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Posts · imshare</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a class="brand" href="/">imshare</a><a href="/posts/">Posts</a
        ><a href="/users/">Users</a><a href="/tags/">Tags</a
        ><a href="/categories/">Categories</a><a href="/search/">Search</a
        ><a href="/account/">Account</a>
      </nav>
    </header>
    <main>
      <h1>Posts</h1>
      <form class="box" id="filters">
        <label for="q">Search</label
        ><input id="q" name="q" type="search" /><button>Search</button>
      </form>
      <p id="status">Loading…</p>
      <section id="posts" class="grid"></section>
    </main>
    <script type="module">
      const root = document.querySelector("#posts");
      const status = document.querySelector("#status");
      const form = document.querySelector("#filters");
      async function load() {
        const q = document.querySelector("#q").value.trim();
        const response = await fetch(
          "/v1/posts?limit=48" + (q ? "&search=" + encodeURIComponent(q) : ""),
        );
        if (!response.ok) throw new Error("request failed");
        const result = await response.json();
        root.replaceChildren();
        status.textContent = result.pagination.total + " post(s)";
        for (const post of result.data) {
          const card = document.createElement("article");
          card.className = "card";
          const image = post.uploads && post.uploads[0];
          if (image) {
            const img = document.createElement("img");
            img.src = image.url + "?width=480&format=webp";
            img.alt = post.title;
            img.loading = "lazy";
            img.decoding = "async";
            card.append(img);
          }
          const title = document.createElement("h2");
          title.textContent = post.title;
          card.append(title);
          const author = document.createElement("p");
          author.className = "meta";
          author.textContent = post.author?.name || "Unknown author";
          card.append(author);
          const stats = document.createElement("p");
          stats.className = "meta";
          stats.textContent = `♥ ${post.reactions?.like || 0} · ★ ${post.reactions?.favorite || 0} · ▣ ${post.reactions?.save || 0}`;
          card.append(stats);
          const link = document.createElement("a");
          link.href = "/posts/" + encodeURIComponent(post.id);
          link.textContent = "View post";
          card.append(link);
          root.append(card);
        }
      }
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        load().catch(() => (status.textContent = "Unable to load posts."));
      });
      load().catch(() => (status.textContent = "Unable to load posts."));
    </script>
  </body>
</html>
