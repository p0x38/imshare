<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post · imshare</title><link rel="stylesheet" href="/style.css"></head><body><header><nav><a class="brand" href="/">imshare</a><a href="/posts/">Posts</a><a href="/users/">Users</a><a href="/tags/">Tags</a><a href="/categories/">Categories</a><a href="/search/">Search</a><a href="/account/">Account</a></nav></header><main><p><a href="/posts/">&larr; Back to posts</a></p><div id="content" class="box">Loading…</div></main><script>const id=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());const root=document.querySelector('#content');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}try{const r=await fetch('/v1/posts/'+encodeURIComponent(id));if(!r.ok)throw new Error();const {data:p}=await r.json();document.title=p.title+' · imshare';root.innerHTML='<h1>'+esc(p.title)+'</h1>'+(p.uploads||[]).map(u=>'<p><a href="'+esc(u.url)+'"><img src="'+esc(u.url)+'" alt="'+esc(u.originalName)+'" style="max-width:100%;height:auto"></a></p>').join('')+(p.description?'<p>'+esc(p.description)+'</p>':'')+'<p class="meta">by <a href="/users/'+encodeURIComponent(p.author.id)+'">'+esc(p.author.name)+'</a><br>Created: '+new Date(p.createdAt).toLocaleString()+'</p>'+(p.category?'<p>Category: <a href="/categories/'+encodeURIComponent(p.category.id)+'">'+esc(p.category.name)+'</a></p>':'')+'<p class="tags">Tags: '+(p.tags||[]).map(t=>'<a href="/tags/'+encodeURIComponent(t.id)+'">'+esc(t.name)+'</a>').join(' ')+'</p>'+(p.sourceUrl?'<p>Source: <a href="'+esc(p.sourceUrl)+'" rel="noopener noreferrer">'+esc(p.sourceUrl)+'</a></p>':'');}catch{root.innerHTML='<h1>Post not found</h1><p>That post does not exist or could not be loaded.</p>';}</script></body></html>
