<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post · imshare</title><link rel="stylesheet" href="/style.css"><script src="/socket.io/socket.io.js"></script></head><body><header><nav><a class="brand" href="/">imshare</a><a href="/posts/">Posts</a><a href="/users/">Users</a><a href="/tags/">Tags</a><a href="/categories/">Categories</a><a href="/search/">Search</a><a href="/account/">Account</a><a href="/notifications/">Notifications</a></nav></header><main><p><a href="/posts/">&larr; Back to posts</a></p><div id="content" class="box">Loading…</div></main><script type="module">
import { api, escapeHtml, imageUrl } from "/app.js";
const id=decodeURIComponent(location.pathname.split("/").filter(Boolean).pop());const root=document.querySelector("#content");let reactionState={counts:{like:0,favorite:0,save:0},active:{like:false,favorite:false,save:false}};
function renderReactions(){for(const type of ["like","favorite","save"]){const b=document.querySelector(`[data-reaction="${type}"]`);if(b){b.textContent=`${type[0].toUpperCase()+type.slice(1)} (${reactionState.counts[type]||0})`;b.dataset.active=String(Boolean(reactionState.active[type]));}}}
async function loadReactions(){const r=await api(`/v1/posts/${encodeURIComponent(id)}/reactions`);reactionState=r.data;renderReactions()}
async function loadComments(){const r=await api(`/v1/posts/${encodeURIComponent(id)}/comments?limit=100`);const box=document.querySelector("#comments");box.innerHTML=r.data.length?r.data.map(c=>`<article class="card"><strong>${escapeHtml(c.author.name)}</strong><p>${escapeHtml(c.body)}</p><p class="meta">${new Date(c.createdAt).toLocaleString()}</p></article>`).join(""):"<p>No comments yet.</p>"}
try{const {data:p}=await api(`/v1/posts/${encodeURIComponent(id)}`);document.title=p.title+" · imshare";root.innerHTML=`<h1>${escapeHtml(p.title)}</h1>${(p.uploads||[]).map(u=>`<p class="post-media"><a href="${escapeHtml(u.url)}"><img class="post-image" src="${escapeHtml(imageUrl(u,1600))}" srcset="${escapeHtml(imageUrl(u,800))} 800w, ${escapeHtml(imageUrl(u,1600))} 1600w" sizes="(max-width: 700px) 100vw, min(1600px, 100vw)" alt="${escapeHtml(u.originalName)}" loading="lazy" decoding="async"></a></p>`).join("")}<div id="reactions" class="reactions"><button data-reaction="like"></button><button data-reaction="favorite"></button><button data-reaction="save"></button></div>${p.description?`<p>${escapeHtml(p.description)}</p>`:""}<p class="meta">by <a href="/users/${encodeURIComponent(p.author.id)}">${escapeHtml(p.author.name)}</a><br>Created: ${new Date(p.createdAt).toLocaleString()}</p>${p.category?`<p>Category: <a href="/categories/${encodeURIComponent(p.category.id)}">${escapeHtml(p.category.name)}</a></p>`:""}<p class="tags">Tags: ${(p.tags||[]).map(t=>`<a href="/tags/${encodeURIComponent(t.id)}">${escapeHtml(t.name)}</a>`).join(" ")}</p>${p.sourceUrl?`<p>Source: <a href="${escapeHtml(p.sourceUrl)}" rel="noopener noreferrer">${escapeHtml(p.sourceUrl)}</a></p>`:""}<section><h2>Comments</h2><div id="comments" class="grid">Loading…</div><form id="comment-form" class="box"><label for="comment-body">Add a comment</label><textarea id="comment-body" maxlength="5000" required></textarea><button>Post comment</button><p id="comment-status" class="meta"></p></form></section>`;document.querySelector("#reactions").addEventListener("click",async e=>{const b=e.target.closest("[data-reaction]");if(!b)return;try{const active=reactionState.active[b.dataset.reaction];reactionState=(await api(`/v1/posts/${encodeURIComponent(id)}/${b.dataset.reaction}`,{method:active?"DELETE":"PUT"})).data;renderReactions()}catch(e){if(e.status===401)alert("Please sign in to react to posts.")}});document.querySelector("#comment-form").addEventListener("submit",async e=>{e.preventDefault();const s=document.querySelector("#comment-status");try{await api(`/v1/posts/${encodeURIComponent(id)}/comments`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({body:document.querySelector("#comment-body").value})});document.querySelector("#comment-body").value="";s.textContent="Comment posted.";await loadComments()}catch(e){s.textContent=e.status===401?"Please sign in to comment.":e.message}});await Promise.all([loadReactions(),loadComments()]);const socket=window.io?.();if(socket){socket.emit("post:subscribe",id);socket.on("post:reaction",e=>{if(e.postId===id){reactionState.counts=e.counts;renderReactions()}})}}catch{root.innerHTML="<h1>Post not found</h1><p>That post does not exist or could not be loaded.</p>"}
</script></body></html>
