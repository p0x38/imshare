<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Post · imshare</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <header>
      <nav>
        <a class="brand" href="/">imshare</a><a href="/posts/">Posts</a
        ><a href="/users/">Users</a><a href="/tags/">Tags</a
        ><a href="/categories/">Categories</a><a href="/search/">Search</a
        ><a href="/account/">Account</a>
      </nav>
    </header>
    <main>
      <p><a href="/posts/">&larr; Back to posts</a></p>
      <div id="content" class="box">Loading…</div>
    </main>
    <script type="module">
      const id = decodeURIComponent(
        location.pathname.split("/").filter(Boolean).pop(),
      );
      const root = document.querySelector("#content");
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      let current;
      let reactionState = {
        counts: { like: 0, favorite: 0, save: 0 },
        active: { like: false, favorite: false, save: false },
      };
      function renderReactions() {
        const el = document.querySelector("#reactions");
        if (!el) return;
        for (const type of ["like", "favorite", "save"]) {
          const button = el.querySelector(`[data-reaction="${type}"]`);
          if (!button) continue;
          button.textContent = `${type[0].toUpperCase() + type.slice(1)} (${reactionState.counts[type] || 0})`;
          button.dataset.active = String(Boolean(reactionState.active[type]));
        }
      }
      async function loadReactions() {
        const response = await fetch(
          "/v1/posts/" + encodeURIComponent(id) + "/reactions",
        );
        if (response.ok) {
          reactionState = (await response.json()).data;
          renderReactions();
        }
      }
      async function toggleReaction(type) {
        const active = reactionState.active[type];
        const response = await fetch(
          "/v1/posts/" + encodeURIComponent(id) + "/" + type,
          { method: active ? "DELETE" : "PUT" },
        );
        if (response.status === 401) {
          alert("Please sign in to react to posts.");
          return;
        }
        if (response.ok) {
          reactionState = (await response.json()).data;
          renderReactions();
        }
      }
      try {
        const r = await fetch("/v1/posts/" + encodeURIComponent(id));
        if (!r.ok) throw new Error();
        const { data: p } = await r.json();
        current = p;
        document.title = p.title + " · imshare";
        root.innerHTML =
          "<h1>" +
          esc(p.title) +
          "</h1>" +
          (p.uploads || [])
            .map(
              (u) =>
                '<p class="post-media"><a href="' +
                esc(u.url) +
                '"><img class="post-image" src="' +
                esc(u.url) +
                '?width=1600&format=webp" srcset="' +
                esc(u.url) +
                "?width=800&format=webp 800w, " +
                esc(u.url) +
                '?width=1600&format=webp 1600w" sizes="(max-width: 800px) 100vw, 1600px" alt="' +
                esc(u.originalName) +
                '" loading="lazy" decoding="async"></a></p>',
            )
            .join("") +
          '<div id="reactions" class="reactions"><button data-reaction="like"></button><button data-reaction="favorite"></button><button data-reaction="save"></button></div>' +
          (p.description ? "<p>" + esc(p.description) + "</p>" : "") +
          '<p class="meta">by <a href="/users/' +
          encodeURIComponent(p.author.id) +
          '">' +
          esc(p.author.name) +
          "</a><br>Created: " +
          new Date(p.createdAt).toLocaleString() +
          "</p>" +
          (p.category
            ? '<p>Category: <a href="/categories/' +
              encodeURIComponent(p.category.id) +
              '">' +
              esc(p.category.name) +
              "</a></p>"
            : "") +
          '<p class="tags">Tags: ' +
          (p.tags || [])
            .map(
              (t) =>
                '<a href="/tags/' +
                encodeURIComponent(t.id) +
                '">' +
                esc(t.name) +
                "</a>",
            )
            .join(" ") +
          "</p>" +
          (p.sourceUrl
            ? '<p>Source: <a href="' +
              esc(p.sourceUrl) +
              '" rel="noopener noreferrer">' +
              esc(p.sourceUrl) +
              "</a></p>"
            : "");
        document
          .querySelector("#reactions")
          .addEventListener("click", (event) => {
            const button = event.target.closest("[data-reaction]");
            if (button) toggleReaction(button.dataset.reaction);
          });
        await loadReactions();
        const socket = window.io?.();
        if (socket) {
          socket.emit("post:subscribe", id);
          socket.on("post:reaction", (event) => {
            if (event.postId !== id) return;
            reactionState.counts = event.counts;
            renderReactions();
          });
        }
      } catch {
        root.innerHTML =
          "<h1>Post not found</h1><p>That post does not exist or could not be loaded.</p>";
      }
    </script>
  </body>
</html>
