<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Post · imshare</title>
        <link rel="stylesheet" href="/style.css" />
        <script src="/imshare-ui.js"></script>
        <script type="module">
            import { mountPostPage } from "/posts/post-page.js";

            const postId = decodeURIComponent(location.pathname.replace(/^\/posts\//, "").replace(/\/$/, ""));

            async function load() {
                const root = document.querySelector("#post");

                try {
                    const response = await window.imshareUI.api(`/v1/posts/${encodeURIComponent(postId)}`);
                    mountPostPage(root, response.data);
                } catch (error) {
                    root.textContent = error instanceof Error ? error.message : "Unable to load post.";
                }
            }

            load();
        </script>
    </head>
    <body>
        <main id="post"></main>
    </body>
</html>
