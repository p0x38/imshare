<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Post · imshare</title>
        <link rel="stylesheet" href="/style.css" />
        <script type="module">
            import "/mui.js";

            const postId = decodeURIComponent(location.pathname.replace(/^\/posts\//, "").replace(/\/$/, ""));

            function formatPost(post) {
                const image = post.uploads?.[0];
                return {
                    ...post,
                    image,
                    imageUrl: image ? `${image.url}?width=1600&format=webp` : null,
                    caption: post.caption || post.description || "",
                    authorName: post.author?.name || post.author?.username || "Unknown author",
                };
            }

            async function load() {
                const root = document.querySelector("#post");
                try {
                    const response = await window.imshareUI.api(`/v1/posts/${encodeURIComponent(postId)}`);
                    const post = formatPost(response.data);
                    window.imshareMUI.mount(root, React.createElement(window.imshareMUI.PostPage, { post }));
                } catch (error) {
                    window.imshareMUI.mount(root, React.createElement(window.imshareMUI.ErrorState, {
                        title: "Unable to load post",
                        description: error instanceof Error ? error.message : "Please try again later.",
                    }));
                }
            }

            window.addEventListener("DOMContentLoaded", load, { once: true });
        </script>
    </head>
    <body>
        <main id="post"></main>
    </body>
</html>
