<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Post · imshare</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><nav><a class="brand" href="/">imshare</a><a href="/posts/">Posts</a><a href="/dashboard/">Dashboard</a><a href="/account/">Account</a></nav></header>
<main>
<h1>New Post</h1>
<form id="post-form" class="box">
<label for="title">Title</label><input id="title" required maxlength="200">
<label for="description">Description</label><textarea id="description"></textarea>
<label for="file">Image</label><input id="file" type="file" accept="image/*" required>
<label for="sourceUrl">Source URL</label><input id="sourceUrl" type="url" placeholder="https://example.com/">
<label for="tags">Tags</label><input id="tags" placeholder="art, landscape, original">
<label for="category">Category</label><select id="category"><option value="">None</option></select>
<button id="submit">Create Post</button>
<p id="error" class="error" hidden></p>
</form>
</main>
<script>
const form = document.querySelector('#post-form');
const error = document.querySelector('#error');
const button = document.querySelector('#submit');
const category = document.querySelector('#category');
async function loadCategories() {
  const response = await fetch('/v1/categories?limit=100');
  if (!response.ok) return;
  const result = await response.json();
  for (const item of result.data || []) { const option = document.createElement('option'); option.value = item.id; option.textContent = item.name; category.append(option); }
}
loadCategories().catch(() => {});
form.addEventListener('submit', async event => {
  event.preventDefault(); error.hidden = true; button.disabled = true; button.textContent = 'Creating…';
  try {
    const file = document.querySelector('#file').files[0];
    if (!file) throw new Error('Please choose an image.');
    const uploadData = new FormData(); uploadData.append('file', file);
    const uploadResponse = await fetch('/v1/uploads', { method: 'POST', body: uploadData });
    if (!uploadResponse.ok) throw new Error('Image upload failed.');
    const uploadResult = await uploadResponse.json();
    const tagNames = document.querySelector('#tags').value.split(',').map(x => x.trim()).filter(Boolean);
    const postResponse = await fetch('/v1/posts', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({
      title: document.querySelector('#title').value,
      description: document.querySelector('#description').value || null,
      sourceUrl: document.querySelector('#sourceUrl').value || null,
      uploadIds: [uploadResult.data.id],
      tags: tagNames,
      categoryId: category.value || null
    }) });
    if (!postResponse.ok) throw new Error('Post creation failed.');
    const postResult = await postResponse.json();
    location.href = '/posts/' + encodeURIComponent(postResult.data.id);
  } catch (err) {
    error.textContent = err instanceof Error ? err.message : 'Unable to create post.'; error.hidden = false;
    button.disabled = false; button.textContent = 'Create Post';
  }
});
</script>
</body>
</html>
