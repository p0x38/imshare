<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>User · imshare</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header>
        <nav><a class="brand" href="/">imshare</a><a href="/posts/">Posts</a><a href="/users/">Users</a><a
                href="/tags/">Tags</a><a href="/categories/">Categories</a><a href="/search/">Search</a><a
                href="/account/">Account</a></nav>
    </header>
    <main>
        <div id="user" class="box">Loading…</div>
        <h2>Posts</h2>
        <div id="posts" class="grid"></div>
    </main>
    <script>const id = location.pathname.split('/').filter(Boolean).at(-1); try { const [ur, pr] = await Promise.all([fetch('/v1/users/' + encodeURIComponent(id)), fetch('/v1/users/' + encodeURIComponent(id) + '/posts?limit=100')]); if (!ur.ok) throw new Error(); const { data: u } = await ur.json(); document.querySelector('#user').innerHTML = '<h1></h1><p>Joined ' + new Date(u.createdAt).toLocaleDateString() + '</p>'; document.querySelector('#user h1').textContent = u.name; const root = document.querySelector('#posts'); const posts = (await pr.json()).data || []; for (const p of posts) { const card = document.createElement('article'); card.className = 'card'; if (p.uploads?.[0]) { const img = document.createElement('img'); img.src = p.uploads[0].url; img.alt = p.title; card.append(img); } const h = document.createElement('h3'); h.textContent = p.title; card.append(h); const a = document.createElement('a'); a.href = '/posts/' + encodeURIComponent(p.id); a.textContent = 'View'; card.append(a); root.append(card); } } catch { document.querySelector('#user').textContent = 'User not found.'; }</script>
</body>

</html>
