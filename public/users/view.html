<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>User · imshare</title>
        <link rel="stylesheet" href="/style.css" />
        <script src="/components.js" defer></script>
    </head>
    <body>
        <site-header></site-header>
        <main>
            <div id="user" class="box">Loading…</div>
            <div id="widgets"></div>
        </main>
        <site-footer></site-footer>
        <script type="module">
            const id = location.pathname.split("/").filter(Boolean).at(-1);
            const esc = (v) =>
                String(v ?? "").replace(
                    /[&<>"']/g,
                    (c) =>
                        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[
                            c
                        ],
                );
            const saved = JSON.parse(localStorage.getItem("imshare.profileWidgets") || "null");
            const order =
                Array.isArray(saved) && saved.length === 3 ? saved : ["basic", "recent", "popular"];
            function widget(id, title, body) {
                return `<section class="box profile-widget" data-widget="${id}"><div class="widget-heading"><h2>${title}</h2><button type="button" data-up="${id}" aria-label="Move widget up">↑</button><button type="button" data-down="${id}" aria-label="Move widget down">↓</button></div>${body}</section>`;
            }
            function cards(list) {
                return list
                    .map(
                        (p) =>
                            `<a class="card" href="/posts/${encodeURIComponent(p.id)}"><strong>${esc(p.title)}</strong>${p.uploads?.[0] ? `<img src="${esc(p.uploads[0].url)}?width=320&format=webp" alt="${esc(p.caption || p.title)}" loading="lazy">` : ""}</a>`,
                    )
                    .join("");
            }
            try {
                const [ur, pr] = await Promise.all([
                    fetch("/v1/users/" + encodeURIComponent(id)),
                    fetch("/v1/users/" + encodeURIComponent(id) + "/posts?limit=100"),
                ]);
                if (!ur.ok) throw new Error();
                const { data: u } = await ur.json();
                const posts = (await pr.json()).data || [];
                document.title = u.name + " · imshare";
                const profile = document.querySelector("#user");
                profile.style.setProperty("--profile-accent", u.accentColor || "#666");
                profile.innerHTML = `${u.profileBannerUrl ? `<img class="profile-banner" src="${esc(u.profileBannerUrl)}" alt="" loading="lazy">` : ""}<div class="profile"><img class="avatar" src="${esc(u.avatarUrl)}" alt="" loading="lazy"><div><h1>${esc(u.name)}</h1><p class="meta">${u._count.posts} post(s) · Joined ${new Date(u.createdAt).toLocaleDateString()}</p>${u.bio ? `<p>${esc(u.bio)}</p>` : ""}<div class="profile-links">${u.websiteUrl ? `<a href="${esc(u.websiteUrl)}" rel="noopener noreferrer nofollow">Website</a>` : ""}${u.githubUrl ? `<a href="${esc(u.githubUrl)}" rel="noopener noreferrer nofollow">GitHub</a>` : ""}${(u.profileLinks || []).map((l) => `<a href="${esc(l.url)}" rel="noopener noreferrer nofollow">${esc(l.label)}</a>`).join("")}</div></div></div>`;
                const map = {
                    basic: widget(
                        "basic",
                        "Basic information",
                        `<p>Joined ${new Date(u.createdAt).toLocaleString()} · ${u._count.posts} post(s)</p>`,
                    ),
                    recent: widget(
                        "recent",
                        "Recent posts",
                        `<div class="grid">${cards(posts.slice(0, 6)) || "<p>No posts yet.</p>"}</div>`,
                    ),
                    popular: widget(
                        "popular",
                        "Popular posts",
                        `<div class="grid">${cards([...posts].sort((a, b) => (b.reactions?.like || 0) - (a.reactions?.like || 0)).slice(0, 6)) || "<p>No posts yet.</p>"}</div>`,
                    ),
                };
                const root = document.querySelector("#widgets");
                const render = () => (root.innerHTML = order.map((x) => map[x]).join(""));
                render();
                root.addEventListener("click", (e) => {
                    const b = e.target.closest("button[data-up],button[data-down]");
                    if (!b) return;
                    const key = b.dataset.up || b.dataset.down,
                        i = order.indexOf(key),
                        j = b.dataset.up ? i - 1 : i + 1;
                    if (j < 0 || j >= order.length) return;
                    [order[i], order[j]] = [order[j], order[i]];
                    localStorage.setItem("imshare.profileWidgets", JSON.stringify(order));
                    render();
                });
            } catch {
                document.querySelector("#user").textContent = "User not found.";
            }
        </script>
    </body>
</html>
