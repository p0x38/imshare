<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Users · imshare</title>
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <header>
      <nav>
        <a class="brand" href="/">imshare</a><a href="/posts/">Posts</a
        ><a href="/users/">Users</a><a href="/tags/">Tags</a
        ><a href="/categories/">Categories</a><a href="/search/">Search</a
        ><a href="/account/">Account</a>
      </nav>
    </header>
    <main>
      <h1>Users</h1>
      <p id="status">Loading…</p>
      <div id="users" class="grid"></div>
    </main>
    <script type="module">
      const root = document.querySelector("#users"),
        status = document.querySelector("#status");
      try {
        const r = await fetch("/v1/users?limit=100");
        if (!r.ok) throw new Error();
        const { data } = await r.json();
        status.textContent = data.length + " user(s)";
        for (const u of data) {
          const card = document.createElement("article");
          card.className = "card";
          const h = document.createElement("h2");
          h.textContent = u.name;
          card.append(h);
          const p = document.createElement("p");
          p.className = "meta";
          p.textContent = (u._count?.posts ?? 0) + " post(s)";
          card.append(p);
          const a = document.createElement("a");
          a.href = "/users/" + encodeURIComponent(u.id);
          a.textContent = "View profile";
          card.append(a);
          root.append(card);
        }
      } catch {
        status.textContent = "Unable to load users.";
      }
    </script>
  </body>
</html>
