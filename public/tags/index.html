<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Tags · imshare</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <header>
            <nav>
                <a class="brand" href="/">imshare</a><a href="/posts/">Posts</a
                ><a href="/users/">Users</a><a href="/tags/">Tags</a
                ><a href="/categories/">Categories</a><a href="/search/">Search</a>
            </nav>
        </header>
        <main>
            <h1>Tags</h1>
            <div id="tags">Loading…</div>
        </main>
        <script type="module">
            try {
                const r = await fetch("/v1/tags?limit=100");
                if (!r.ok) throw new Error();
                const { data } = await r.json();
                const root = document.querySelector("#tags");
                root.replaceChildren();
                for (const t of data) {
                    const p = document.createElement("p");
                    const a = document.createElement("a");
                    a.href = "/tags/" + encodeURIComponent(t.id);
                    a.textContent = t.name;
                    p.append(a);
                    root.append(p);
                }
            } catch {
                document.querySelector("#tags").textContent = "Unable to load tags.";
            }
        </script>
    </body>
</html>
