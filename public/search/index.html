<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Search · imshare</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a class="brand" href="/">imshare</a><a href="/posts/">Posts</a
        ><a href="/users/">Users</a><a href="/tags/">Tags</a
        ><a href="/categories/">Categories</a><a href="/search/">Search</a
        ><a href="/account/">Account</a>
      </nav>
    </header>
    <main>
      <h1>Search</h1>
      <form id="form" class="box">
        <label for="q">Query</label><input id="q" required /><button>
          Search
        </button>
      </form>
      <p id="status"></p>
      <div id="results"></div>
    </main>
    <script>
      const form = document.querySelector("#form"),
        root = document.querySelector("#results"),
        status = document.querySelector("#status");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const q = document.querySelector("#q").value.trim();
        if (!q) return;
        try {
          const r = await fetch(
            "/v1/search?q=" + encodeURIComponent(q) + "&type=all&limit=25",
          );
          if (!r.ok) throw new Error();
          const { data } = await r.json();
          root.replaceChildren();
          status.textContent = "Results for “" + q + "”";
          for (const group of data) {
            const box = document.createElement("div");
            box.className = "box";
            const h = document.createElement("h2");
            h.textContent = group.type;
            box.append(h);
            const pre = document.createElement("pre");
            pre.textContent = JSON.stringify(group.items, null, 2);
            box.append(pre);
            root.append(box);
          }
        } catch {
          status.textContent = "Search failed.";
        }
      });
    </script>
  </body>
</html>
