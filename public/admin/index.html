<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · imshare</title><link rel="stylesheet" href="/style.css"></head>
<body><main><h1>Admin</h1><div id="status" class="box">Loading…</div><section id="panel" hidden><h2>Overview</h2><div id="overview" class="box"></div><h2>Registration token</h2><pre id="token" class="box"></pre><h2>Users</h2><input id="search" placeholder="Search users"><div id="users"></div><h2>Reports</h2><div id="reports"></div><h2>Moderation log</h2><div id="logs"></div></section></main><script type="module">
const status=document.querySelector('#status'),panel=document.querySelector('#panel');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options){const r=await fetch(url,options);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error?.message||r.statusText);return r.json();}
async function load(){try{const me=await api('/v1/me');if(!['admin','moderator'].includes(me.data?.role))throw new Error('Administrator or moderator access is required.');panel.hidden=false;status.remove();const o=await api('/v1/admin/overview');overview.innerHTML=Object.entries(o.data).map(([k,v])=>`<strong>${esc(k)}</strong>: ${esc(v)}`).join(' · ');if(me.data.role==='admin'){const t=await api('/v1/admin/registration-token');token.textContent=`${t.data.token}\nexpires: ${new Date(t.data.expiresAt).toLocaleString()}`;}else{document.querySelector('#token').textContent='Only administrators can view the registration token.';}
await users();await reports();await logs();}catch(e){status.textContent=e.message;}}
async function users(){const q=document.querySelector('#search').value;const r=await api('/v1/admin/users?limit=100&search='+encodeURIComponent(q));document.querySelector('#users').innerHTML=r.data.map(u=>`<article class="box"><strong>${esc(u.name)}</strong> <small>${esc(u.email)}</small><p>role: ${esc(u.role)} · ${u.isBanned?'banned':'active'}</p><button data-action="kick" data-id="${esc(u.id)}">Kick</button> ${u.isBanned?`<button data-action="unban" data-id="${esc(u.id)}">Unban</button>`:`<button data-action="ban" data-id="${esc(u.id)}">Ban</button>`}</article>`).join('')||'<p>No users.</p>';}
async function reports(){const r=await api('/v1/admin/reports?limit=50');document.querySelector('#reports').innerHTML=r.data.map(x=>`<article class="box"><strong>${esc(x.reason)}</strong><p>${esc(x.details||'')}</p><button data-report="${esc(x.id)}" data-status="resolved">Resolve</button> <button data-report="${esc(x.id)}" data-status="dismissed">Dismiss</button></article>`).join('')||'<p>No open reports.</p>';}
async function logs(){const r=await api('/v1/admin/logs');document.querySelector('#logs').innerHTML=r.data.map(x=>`<div>${esc(x.createdAt)} — ${esc(x.action)} — ${esc(x.actor.name)} → ${esc(x.targetUser.name)}${x.reason?` — ${esc(x.reason)}`:''}</div>`).join('')||'<p>No moderation actions yet.</p>';}
document.querySelector('#search').addEventListener('input',()=>users());document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.report){await api('/v1/admin/reports/'+b.dataset.report,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:b.dataset.status})});await reports();await logs();return;}if(b.dataset.action==='ban'){const reason=prompt('Ban reason:');if(!reason)return;const duration=prompt('Duration in hours; 0 means permanent:','24');await api('/v1/admin/users/'+b.dataset.id+'/ban',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reason,durationHours:Number(duration)})});}else await api('/v1/admin/users/'+b.dataset.id+'/'+b.dataset.action,{method:'POST'});await users();await logs();}catch(e){alert(e.message);}});load();
</script></body></html>
