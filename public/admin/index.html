<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Admin · imshare</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <main>
            <h1>Admin</h1>
            <p id="status">Loading…</p>
            <section id="overview" class="box"></section>
            <section id="registration" class="box"></section>
            <section class="box">
                <h2>Users</h2>
                <div id="users">Loading…</div>
            </section>
            <section class="box">
                <h2>Open reports</h2>
                <div id="reports">Loading…</div>
            </section>
            <section class="box">
                <h2>Moderation log</h2>
                <div id="logs">Loading…</div>
            </section>
        </main>
        <script type="module">
            const $ = (s) => document.querySelector(s);
            const esc = (v) =>
                String(v ?? "").replace(
                    /[&<>\"]/g,
                    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c] ?? c,
                );
            async function api(p, o = {}) {
                const r = await fetch(p, {
                    headers: { "content-type": "application/json", ...(o.headers ?? {}) },
                    ...o,
                });
                if (r.status === 401) {
                    location.href = "/account/login/";
                    return;
                }
                if (!r.ok)
                    throw new Error(
                        (await r.json().catch(() => null))?.error?.message ?? `HTTP ${r.status}`,
                    );
                return r.json();
            }
            async function load() {
                const o = await api("/v1/admin/overview");
                $("#overview").innerHTML =
                    `<strong>${o.data.users}</strong> users · <strong>${o.data.posts}</strong> posts · <strong>${o.data.openReports}</strong> open reports · <strong>${o.data.bannedUsers}</strong> banned`;
                const t = await api("/v1/admin/registration-token");
                $("#registration").innerHTML =
                    `<h2>Registration token</h2><code>${esc(t.data.token)}</code><p>Expires: ${esc(t.data.expiresAt)}</p>`;
                const u = await api("/v1/admin/users?limit=50");
                $("#users").innerHTML = u.data
                    .map(
                        (x) =>
                            `<p><strong>${esc(x.name)}</strong> · ${esc(x.email)} · ${esc(x.role)} · ${x.isBanned ? "banned" : "active"} <button data-a="${x.isBanned ? "unban" : "kick"}" data-id="${esc(x.id)}">${x.isBanned ? "Unban" : "Kick"}</button> <button data-a="ban" data-id="${esc(x.id)}">Ban</button></p>`,
                    )
                    .join("");
                const r = await api("/v1/admin/reports");
                $("#reports").innerHTML =
                    r.data
                        .map(
                            (x) =>
                                `<p>${esc(x.reason)} · <button data-report="${esc(x.id)}" data-status="resolved">Resolve</button> <button data-report="${esc(x.id)}" data-status="dismissed">Dismiss</button></p>`,
                        )
                        .join("") || "No open reports.";
                const l = await api("/v1/admin/logs");
                $("#logs").innerHTML =
                    l.data
                        .map(
                            (x) =>
                                `<p>${esc(x.action)} · ${esc(x.actor?.name)} → ${esc(x.targetUser?.name)} · ${esc(x.reason)}</p>`,
                        )
                        .join("") || "No moderation actions yet.";
                $("#status").textContent = "Loaded.";
            }
            document.addEventListener("click", async (e) => {
                const b = e.target.closest("button[data-a]"),
                    r = e.target.closest("button[data-report]");
                try {
                    if (b) {
                        const id = b.dataset.id;
                        if (b.dataset.a === "ban") {
                            const reason = prompt("Ban reason:");
                            if (!reason) return;
                            await api(`/v1/admin/users/${id}/ban`, {
                                method: "POST",
                                body: JSON.stringify({ reason }),
                            });
                        } else
                            await api(`/v1/admin/users/${id}/${b.dataset.a}`, {
                                method: "POST",
                                body: "{}",
                            });
                        await load();
                    }
                    if (r) {
                        await api(`/v1/admin/reports/${r.dataset.report}`, {
                            method: "PATCH",
                            body: JSON.stringify({ status: r.dataset.status }),
                        });
                        await load();
                    }
                } catch (e) {
                    alert(e.message);
                }
            });
            load().catch((e) => ($("#status").textContent = e.message));
        </script>
    </body>
</html>
