<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login · imshare</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a class="brand" href="/">imshare</a><a href="/posts/">Posts</a
        ><a href="/account/">Account</a>
      </nav>
    </header>
    <main>
      <h1>Log in</h1>
      <form id="login" class="box">
        <label for="email">Email</label
        ><input id="email" name="email" type="email" required /><label
          for="password"
          >Password</label
        ><input
          id="password"
          name="password"
          type="password"
          required
        /><button>Log in</button>
        <p id="error" class="error" hidden></p>
      </form>
      <p>No account? <a href="/account/register/">Create one</a>.</p>
    </main>
    <script>
      document
        .querySelector("#login")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const error = document.querySelector("#error");
          error.hidden = true;
          const response = await fetch("/v1/auth/sign-in/email", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              email: email.value,
              password: password.value,
            }),
          });
          if (response.ok) location.href = "/dashboard/";
          else {
            error.textContent = "Login failed.";
            error.hidden = false;
          }
        });
    </script>
  </body>
</html>
