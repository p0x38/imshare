<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account · imshare</title><link rel="stylesheet" href="/style.css"></head><body><header><nav><a class="brand" href="/">imshare</a><a href="/posts/">Posts</a><a href="/users/">Users</a><a href="/tags/">Tags</a><a href="/categories/">Categories</a><a href="/search/">Search</a><a href="/account/">Account</a></nav></header><main><h1>Account</h1><div id="content" class="box">Checking session…</div></main><script type="module">const content=document.querySelector('#content');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const response=await fetch('/v1/auth/get-session');const session=response.ok?await response.json():null;const user=session?.user;if(!user){content.innerHTML='<p>You are not signed in.</p><p><a class="button" href="/account/login/">Log in</a> <a class="button" href="/account/register/">Create account</a></p>';return}content.innerHTML='<div class="profile">'+(user.image?'<img class="avatar" src="'+esc(user.image)+'" alt="">':'<div class="avatar"></div>')+'<div><h2>'+esc(user.name||'Account')+'</h2><p>'+esc(user.email||'')+'</p></div></div><hr><form id="profile-form"><label for="name">Name</label><input id="name" value="'+esc(user.name||'')+'" maxlength="100" required><label for="image">Profile picture URL</label><input id="image" type="url" value="'+esc(user.image||'')+'" maxlength="2048"><label for="bio">Profile description</label><textarea id="bio" maxlength="2000">'+esc(user.bio||'')+'</textarea><label for="websiteUrl">Website</label><input id="websiteUrl" type="url" value="'+esc(user.websiteUrl||'')+'" maxlength="2048"><label for="githubUrl">GitHub</label><input id="githubUrl" type="url" value="'+esc(user.githubUrl||'')+'" maxlength="2048"><button>Save profile</button><p id="profile-status" class="meta"></p></form><p><a class="button" href="/dashboard/">Dashboard</a> <a class="button" href="/account/logout/">Log out</a></p>';document.querySelector('#profile-form').addEventListener('submit',async e=>{e.preventDefault();const status=document.querySelector('#profile-status');const body={name:document.querySelector('#name').value,image:document.querySelector('#image').value||null,bio:document.querySelector('#bio').value||null,websiteUrl:document.querySelector('#websiteUrl').value||null,githubUrl:document.querySelector('#githubUrl').value||null};const r=await fetch('/v1/users/'+encodeURIComponent(user.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});status.textContent=r.ok?'Profile saved.':'Unable to save profile.';if(r.ok)await load()})}load().catch(()=>content.textContent='Unable to load account information.');</script></body></html>
