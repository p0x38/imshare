<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>imshare</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <header>
            <nav>
                <a class="brand" href="/">imshare</a><a href="/posts/">Posts</a
                ><a href="/users/">Users</a><a href="/tags/">Tags</a
                ><a href="/categories/">Categories</a><a href="/search/">Search</a
                ><a href="/account/">Account</a>
            </nav>
        </header>
        <main>
            <div class="box">
                <h1>Recent artwork</h1>
                <p>A self-hosted image archive.</p>
                <p><a class="button" href="/dashboard/posts/new/">New post</a></p>
            </div>
            <section id="posts" class="grid"></section>
            <p id="status" class="notice">Loading…</p>
        </main>
        <script>
            const root = document.querySelector("#posts");
            const status = document.querySelector("#status");
            (async () => {
                try {
                    const response = await fetch("/v1/posts?limit=24");
                    if (!response.ok) throw new Error("API request failed");
                    const { data } = await response.json();
                    status.remove();
                    if (!data.length) {
                        root.innerHTML = "<p>No posts yet.</p>";
                        return;
                    }
                    for (const post of data) {
                        const image = post.uploads?.[0];
                        const card = document.createElement("a");
                        card.href = `/posts/${encodeURIComponent(post.id)}`;
                        card.className = "card";
                        if (image) {
                            const img = document.createElement("img");
                            img.src = `${image.url}?width=480&format=webp`;
                            img.alt = post.title || "";
                            img.loading = "lazy";
                            img.decoding = "async";
                            card.append(img);
                        }
                        const heading = document.createElement("h2");
                        heading.textContent = post.title;
                        card.append(heading);
                        const meta = document.createElement("p");
                        meta.className = "meta";
                        meta.textContent = post.author?.name ?? "Unknown author";
                        card.append(meta);
                        root.append(card);
                    }
                } catch (error) {
                    status.textContent = "Unable to load posts.";
                    console.error(error);
                }
            })();
        </script>
    </body>
</html>
