<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category · imshare</title><link rel="stylesheet" href="/style.css"></head><body><header><nav><a class="brand" href="/">imshare</a><a href="/posts/">Posts</a><a href="/categories/">Categories</a></nav></header><main><div id="info" class="box">Loading…</div><div id="posts" class="grid"></div></main><script>const id=location.pathname.split('/').filter(Boolean).at(-1);try{const [cr,pr]=await Promise.all([fetch('/v1/categories/'+encodeURIComponent(id)),fetch('/v1/categories/'+encodeURIComponent(id)+'/posts?limit=100')]);if(!cr.ok)throw new Error();const {data:c}=await cr.json(),posts=(await pr.json()).data||[];document.querySelector('#info').innerHTML='<h1></h1><p>'+posts.length+' post(s)</p>';document.querySelector('#info h1').textContent=c.name;const root=document.querySelector('#posts');for(const p of posts){const x=document.createElement('article');x.className='card';if(p.uploads?.[0]){const i=document.createElement('img');i.src=p.uploads[0].url;i.alt=p.title;x.append(i);}const h=document.createElement('h2');h.textContent=p.title;x.append(h);const a=document.createElement('a');a.href='/posts/'+encodeURIComponent(p.id);a.textContent='View';x.append(a);root.append(x);}}catch{document.querySelector('#info').textContent='Category not found.';}</script></body></html>
