<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Category · imshare</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/components.js" defer></script>
  </head>
  <body>
    <site-header></site-header>
    <main>
      <div id="info" class="box">Loading…</div>
      <div id="posts" class="grid"></div>
    </main>
    <script type="module">
      const id = location.pathname.split("/").filter(Boolean).at(-1);
      try {
        const [cr, pr] = await Promise.all([
          fetch("/v1/categories/" + encodeURIComponent(id)),
          fetch("/v1/categories/" + encodeURIComponent(id) + "/posts?limit=100"),
        ]);
        if (!cr.ok || !pr.ok) throw new Error();
        const { data: category } = await cr.json();
        const { data: posts } = await pr.json();
        document.querySelector("#info").innerHTML = "<h1></h1><p>" + posts.length + " post(s)</p>";
        document.querySelector("#info h1").textContent = category.name;
        const root = document.querySelector("#posts");
        for (const post of posts) {
          const card = document.createElement("article");
          card.className = "card";
          if (post.uploads?.[0]) {
            const image = document.createElement("img");
            image.src = post.uploads[0].url;
            image.alt = post.title;
            card.append(image);
          }
          const heading = document.createElement("h2");
          heading.textContent = post.title;
          card.append(heading);
          const link = document.createElement("a");
          link.href = "/posts/" + encodeURIComponent(post.id);
          link.textContent = "View";
          card.append(link);
          root.append(card);
        }
      } catch {
        document.querySelector("#info").textContent = "Category not found.";
      }
    </script>
  </body>
</html>
