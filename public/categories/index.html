<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Categories · imshare</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <header>
            <nav>
                <a class="brand" href="/">imshare</a><a href="/posts/">Posts</a
                ><a href="/users/">Users</a><a href="/categories/">Categories</a>
            </nav>
        </header>
        <main>
            <h1>Categories</h1>
            <div id="categories">Loading…</div>
        </main>
        <script type="module">
            try {
                const r = await fetch("/v1/categories?limit=100");
                if (!r.ok) throw new Error();
                const { data } = await r.json(),
                    root = document.querySelector("#categories");
                root.replaceChildren();
                for (const c of data) {
                    const p = document.createElement("p");
                    const a = document.createElement("a");
                    a.href = "/categories/" + encodeURIComponent(c.id);
                    a.textContent = c.name;
                    p.append(a);
                    root.append(p);
                }
            } catch {
                document.querySelector("#categories").textContent = "Unable to load categories.";
            }
        </script>
    </body>
</html>
